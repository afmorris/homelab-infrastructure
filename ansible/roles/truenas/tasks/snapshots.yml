---
# Periodic ZFS snapshot tasks. A task is identified by dataset + naming
# schema: missing tasks are created, existing ones are left as they are
# (change retention in the TrueNAS UI or delete the task and re-run).

- name: Fetch existing snapshot tasks
  uri:
    url: "{{ truenas_api_url }}/pool/snapshottask"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_truenas_api_token }}"
    validate_certs: "{{ truenas_validate_certs }}"
  register: truenas_existing_snapshot_tasks

- name: Create missing snapshot tasks
  uri:
    url: "{{ truenas_api_url }}/pool/snapshottask"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_truenas_api_token }}"
    body_format: json
    body:
      dataset: "{{ item.dataset }}"
      recursive: "{{ item.recursive | default(false) }}"
      exclude: []
      lifetime_value: "{{ item.keep }}"
      lifetime_unit: "{{ item.keep_unit }}"
      naming_schema: "{{ item.naming_schema }}"
      allow_empty: false
      enabled: true
      schedule: "{{ item.schedule }}"
    validate_certs: "{{ truenas_validate_certs }}"
    status_code: 200
  loop: "{{ truenas_snapshot_tasks }}"
  loop_control:
    label: "{{ item.dataset }} ({{ item.naming_schema }})"
  when: >
    truenas_existing_snapshot_tasks.json
    | selectattr('dataset', 'equalto', item.dataset)
    | selectattr('naming_schema', 'equalto', item.naming_schema)
    | list | length == 0
