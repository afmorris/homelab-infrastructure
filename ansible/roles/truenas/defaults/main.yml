---
# TrueNAS API connection — override truenas_api_url/truenas_validate_certs in all.yml
# vault_truenas_api_token must be set in group_vars/all/vault.yml

# Dataset permissions applied to all managed datasets
truenas_dataset_mode: "775"   # owner=rwx, group=rwx, other=r-x
truenas_dataset_owner: "{{ admin_user_name }}"   # tony
truenas_dataset_uid: "{{ admin_uid }}"           # 3001
truenas_dataset_gid: "{{ media_gid }}"           # 2000 (media group)

# NFS datasets to manage. Each entry needs:
#   path    — absolute path on TrueNAS (the ZFS dataset mountpoint)
#   comment — human-readable label shown in TrueNAS UI
truenas_datasets:
  - path: /mnt/storage0/media
    comment: Media library
  - path: /mnt/storage0/data
    comment: General data
  - path: /mnt/storage0/metadata
    comment: Service metadata
  - path: /mnt/storage0/transcode
    comment: Plex transcode scratch
  - path: /mnt/storage0/usenet
    comment: Usenet downloads
  - path: /mnt/storage0/kubernetes
    comment: Kubernetes persistent volumes

# ZFS datasets to create if missing (parents before children). Unlike
# truenas_datasets above, these get no NFS share or ownership changes.
truenas_managed_datasets:
  - name: storage0/pictures
    comment: "Family photos: library/ (archive) and icloud/ (iCloud backups)"
  - name: storage0/apps
    comment: Configuration for apps running on TrueNAS
  - name: storage0/apps/icloud-backup
    comment: icloud-backup-docker config, sessions and archive

# Periodic snapshot tasks. keep_unit: HOUR, DAY, WEEK, MONTH or YEAR.
# Photos rarely change once written, so long retention costs little.
truenas_snapshot_tasks:
  - dataset: storage0/pictures
    naming_schema: "daily-%Y-%m-%d_%H-%M"
    keep: 30
    keep_unit: DAY
    schedule: { minute: "0", hour: "3", dom: "*", month: "*", dow: "*" }
  - dataset: storage0/pictures
    naming_schema: "monthly-%Y-%m-%d_%H-%M"
    keep: 12
    keep_unit: MONTH
    schedule: { minute: "30", hour: "3", dom: "1", month: "*", dow: "*" }
  - dataset: storage0/apps/icloud-backup
    naming_schema: "daily-%Y-%m-%d_%H-%M"
    keep: 14
    keep_unit: DAY
    schedule: { minute: "15", hour: "3", dom: "*", month: "*", dow: "*" }
