---
- name: Create NFS mount point directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  become: true
  loop:
    - /mnt/data
    - /mnt/k8s
    - /mnt/media
    - /mnt/metadata
    - /mnt/transcode
  when: "'storage' not in group_names"

- name: Mount NFS shares
  ansible.posix.mount:
    name: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: nfs
    opts: "defaults,_netdev"
    state: mounted
    dump: 0
    passno: 2
  become: true
  loop:
    - { src: "truenas:/mnt/storage0/data",      path: "/mnt/data" }
    - { src: "truenas:/mnt/storage0/kubernetes", path: "/mnt/k8s" }
    - { src: "truenas:/mnt/storage0/media",      path: "/mnt/media" }
    - { src: "truenas:/mnt/storage0/metadata",   path: "/mnt/metadata" }
    - { src: "truenas:/mnt/storage0/transcode",  path: "/mnt/transcode" }
  when: "'storage' not in group_names"

# TrueNAS no longer exports usenet (SABnzbd works under /mnt/media/usenet), so
# the old entry could never mount. Remove it where it is still in fstab.
# Safe to delete this task once every machine has had one real run.
- name: Remove the old usenet NFS entry
  ansible.posix.mount:
    path: /mnt/usenet
    state: absent
  become: true
  when: "'storage' not in group_names"
